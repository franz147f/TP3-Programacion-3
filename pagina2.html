<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inscripcion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/estilos.css" media="all" >
</head>
<body>
    <h1>Inscripciones a actividades deportivas </h1>
    <a href="pagina1.html#actividades"> Actividades propuestas</a>
    <hr>
    <div class="container" id="inscripciones">

        <form action="pagina3.html" method="get">
            <fieldset>
                <legend> Actividad </legend>
                <label for="campo-actividad"> Actividad </label>
                <select id="campo-actividad" name="actividad">
                    <option value="futbol">Futbol</option>
                    <option value="voley">Voley</option>
                    <option value="basquet">Basquet</option>
                    <option value="atletismo">Atletismo</option>
                </select>
                <br>
                <label for="lugar"> Lugar </label>
                <select id="lugar" name="lugar">
                    <option value="cancha">Cancha principal</option>
                    <option value="polideportivo">Polideportivo</option>
                    
                </select>
                <br>
                <label for="dia" > Dia </label>
                <input id="dia" type="text" name="dia" placeholder="Ingrese el dia " >
                <br>
                <label for="horario"> Horario </label>
                <input id="horario" type="text" name="horario" placeholder="Ingrese la hora " >
            </fieldset>
            <hr>
            <fieldset>
                <legend>Datos personales</legend>
                <label for="nombre"> Nombre y Apellido</label>
                <input id="nombre" type="text" name="nombre" placeholder="ingrese su nombre y Apellido" maxlength="100" required>
                <br>
                <label for="dni"> DNI </label>
                <input id="dni" type="text" name="dni" inputmode="numeric" pattern="[0-9]*" placeholder="24864587" maxlength="8" required>
                <br>
                <label for ="fecha_nacimiento"> fecha_nacimiento </label>
                <input id="fecha_nacimiento" type="date" name="fecha_nacimiento" >
                <br>
                <label for="email"> Email </label>
                <input id="email" type="email" name="email" placeholder="Ingrese su email" >
                <br>
                <label for="telefono"> telefono</label>
                <input id="telefono" type="tel" name="telefono" placeholder="11 1234-5678" >
                <br>
                <p>Sexo:</p>
                <input  id="masculino" type="radio" value="masculino" name="sexo">
                <label for="masculino">Masculino</label>
                <br>
                <input  id="femenino" type="radio" value="femenino" name="sexo">
                <label for="femenino">Femenino</label>
                <br>
                <input  id="no-binario" type="radio" value="no-binario" name="sexo">
                <label for="no-binario">No-binario</label>
                <br>
            </fieldset>
            <hr>
            <fieldset>
                <legend>Informacion deportiva</legend>
                
                <p>nivel:</p>
                
                <select id="nivel-deportivo" name="nivel" >
                    <option value="Inicial">Inicial</option>
                    <option value="intermedio">intermedio</option>
                    <option value="avanzado">avanzado</option>
                    
                </select>
                
                <p>posee experiencia previa?</p>
                <input  id="si" type="radio" value="si" name="experiencia">
                <label for="si">SI</label>
                <br>
                
                <input  id="no" type="radio" value="no" name="experiencia" required>
                <label for="no">NO</label>
                <br>
                <label for="observacion"> observaciones</label>
                <br>
                <textarea name="observaciones" id="observacion" cols="50" rows="4"></textarea>
            </fieldset>
            <hr>
            <fieldset>
                <legend> terminos y condiciones</legend>
                <input type="checkbox" name="terminos" id="TYC" value="aceptado" required>
                <label for="TYC">Acepto los términos y condiciones de inscripción</label>
            </fieldset>
            <br>
        <button type="submit">Aceptar</button>
        <button type="reset">Cancelar</button>
    </form>
    </div>
    

<footer>Deportes Unca -2026</footer>

</body>
</html>
